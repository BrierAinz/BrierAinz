<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">BrierStudios - Yggdrasil Ecosystem</title>
  <desc id="desc">Reusable dark technical repository banner for BrierStudios and the Yggdrasil ecosystem.</desc>
  <defs>
