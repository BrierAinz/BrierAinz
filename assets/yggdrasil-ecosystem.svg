      <text x="201" y="311" text-anchor="middle" fill="#f2f5f7" font-size="15" font-weight="700">HELHEIM</text>
      <text x="201" y="331" text-anchor="middle" fill="#8fd8e8" font-size="10">READ-ONLY ARCHIVE</text>
    </g>
