<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Yggdrasil - Nine Realms Ecosystem</title>
  <desc id="desc">Visual map of the nine Yggdrasil software realms and their responsibilities.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06090e"/>
      <stop offset="0.55" stop-color="#0a1119"/>
      <stop offset="1" stop-color="#0e1822"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8fd8e8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8fd8e8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8fd8e8" stroke-opacity="0.038"/>
    </pattern>
  </defs>
  <rect width="1200" height="520" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="18" fill="url(#grid)"/>
  <circle cx="600" cy="265" r="165" fill="url(#core)"/>
  <g stroke="#8fd8e8" stroke-opacity="0.20" stroke-width="1.4" fill="none">
    <path d="M600 235L600 96M600 235L930 116M600 235L986 260M600 235L914 414M600 235L676 452M600 235L330 426M600 235L206 316M600 235L258 138M600 235L466 64"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
