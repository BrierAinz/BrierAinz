      <text x="466" y="59" text-anchor="middle" fill="#f2f5f7" font-size="15" font-weight="700">MIDGARD</text>
      <text x="466" y="79" text-anchor="middle" fill="#8fd8e8" font-size="10">PERSONAL TOOLS / EXPERIMENTS</text>
