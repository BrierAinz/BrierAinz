      <text x="938" y="109" text-anchor="middle" fill="#f2f5f7" font-size="15" font-weight="700">VANAHEIM</text>
      <text x="938" y="129" text-anchor="middle" fill="#8fd8e8" font-size="10">AGENTS / FRAMEWORKS</text>
    </g>
