      <text x="328" y="419" text-anchor="middle" fill="#f2f5f7" font-size="15" font-weight="700">SVARTALFHEIM</text>
      <text x="328" y="439" text-anchor="middle" fill="#8fd8e8" font-size="10">DOCS / KNOWLEDGE / TOOLING</text>
    </g>
