    <g>
      <circle cx="600" cy="265" r="74" fill="#0d1821" stroke="#d5b96d" stroke-opacity="0.8" stroke-width="2"/>
      <path d="M600 309V217M600 234L572 211M600 234L628 211M600 252L560 229M600 252L640 229M600 270L553 254M600 270L647 254" fill="none" stroke="#8fd8e8" stroke-width="2" stroke-linecap="round"/>
      <text x="600" y="334" text-anchor="middle" fill="#f2f5f7" font-size="16" font-weight="700" letter-spacing="3">YGGDRASIL</text>
      <text x="600" y="354" text-anchor="middle" fill="#a8b7c2" font-size="10" letter-spacing="2">ORCHESTRATION / WORLD TREE</text>
    </g>
